spring:
  datasource:
    url: jdbc:h2:mem:typing_game_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/vendor/{vendor}

# テストはH2のMySQL互換モードで動かすため、DomaもH2の方言にします。
doma:
  dialect: h2

app:
  jwt:
    secret: test-jwt-secret-key-for-typing-game-backend-32bytes
    expires-in-seconds: 3600
    issuer: typing-game-backend-test
